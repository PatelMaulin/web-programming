<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350">
<!-- Simple black and white cricket history image -->
<rect width="700" height="350" fill="white"/>
<rect x="1" y="1" width="698" height="348" fill="none" stroke="black"/>
<text x="350" y="45" text-anchor="middle" font-family="Arial" font-size="28" fill="black">Cricket History</text>
<rect x="160" y="90" width="380" height="190" fill="white" stroke="black" stroke-width="3"/>
<line x1="350" y1="90" x2="350" y2="280" stroke="black" stroke-width="2"/>
<circle cx="255" cy="150" r="20" fill="white" stroke="black" stroke-width="3"/>
<line x1="255" y1="170" x2="255" y2="230" stroke="black" stroke-width="6"/>
<line x1="255" y1="190" x2="215" y2="225" stroke="black" stroke-width="5"/>
<line x1="255" y1="190" x2="300" y2="160" stroke="black" stroke-width="5"/>
<rect x="300" y="125" width="8" height="100" fill="white" stroke="black" stroke-width="2" transform="rotate(-20 304 175)"/>
<line x1="430" y1="170" x2="430" y2="240" stroke="black" stroke-width="5"/>
<line x1="445" y1="170" x2="445" y2="240" stroke="black" stroke-width="5"/>
<line x1="460" y1="170" x2="460" y2="240" stroke="black" stroke-width="5"/>
</svg>