<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login</title><link rel="stylesheet" href="style.css"></head>
<body>
  <main><h1>Login</h1>
    <!-- Submitting sends username and password to the /login endpoint. -->
    <form method="POST" action="/login">
      <label for="username">Username</label><input id="username" name="username" required>
      <label for="password">Password</label><input id="password" type="password" name="password" required>
      <button type="submit">Login</button>
    </form>
    <p>New user? <a href="/register.html">Register here</a></p>
  </main>
</body></html>
